# Base44 development compose — runs the app from the cloned source with live reload.
# Single-origin: the Express server (tsx watch) mounts Vite middleware in dev mode,
# serving both the tRPC API and the React client on port 3000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finesse
      POSTGRES_PASSWORD: finesse_dev_pw
      POSTGRES_DB: finesse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finesse -d finesse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      # Local infra credentials (generated, not user secrets)
      DATABASE_URL: postgresql://finesse:finesse_dev_pw@db:5432/finesse
      DATABASE_SSL: "false"
      # Dev-only auth (local provider auto-logs in the owner in development)
      JWT_SECRET: base44-dev-jwt-secret-change-me
      OWNER_OPEN_ID: dev-owner
      # Pass the public host suffix through so the preview origin is reachable
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    # Platform-delivered external secrets (LLM keys, etc.) — LAST so they win
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
             npx drizzle-kit migrate &&
             npm run dev"

volumes:
  pgdata:
  node_modules:
